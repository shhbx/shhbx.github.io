<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Multichannel Speech Enhancement with Spatial-Aware Explicit Phase Estimation</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
  line-height: 1.7;
  color: #334155;
  background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
  padding: 2rem 1rem;
}

.container {
  max-width: 1600px;
  margin: auto;
  background: #fff;
  padding: 3rem;
  border-radius: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.authors {
  text-align: center;
  margin-bottom: 20px;
}

.links {
  text-align: center;
  margin-bottom: 30px;
}

.links a {
  margin: 0 10px;
  padding: 8px 14px;
  border-radius: 8px;
  text-decoration: none;
  color: white;
}

.links a:nth-child(1){ background:#16a34a;}
.links a:nth-child(2){ background:#f59e0b; color:#000;}

h2 {
  text-align: center;
  margin: 30px 0 10px;
}

.sample-section {
  margin-top: 30px;
  padding: 15px;
  border-radius: 12px;
}

.sample-section:nth-child(odd){background:#f8fafc;}
.sample-section:nth-child(even){background:#eff6ff;}

.sample-title {
  text-align: center;
  font-weight: bold;
  margin-bottom: 15px;
}

.snr-row {
  margin-bottom: 25px;
  border-bottom: 1px dashed #ccc;
}

.snr-title {
  display:inline-block;
  margin-bottom:10px;
  padding:5px 10px;
  background:#dbeafe;
  border-radius:6px;
}

.model-grid {
  display:grid;
  grid-template-columns: repeat(5,1fr);
  gap:10px;
}

.model-card {
  text-align:center;
  font-size:13px;
}

.spec-img {
  width:100%;
  border-radius:5px;
}

audio {
  width:100%;
}
</style>
</head>

<body>
<div class="container">

<h1>Multichannel Speech Enhancement with Spatial-Aware Explicit Phase Estimation</h1>
<div class="authors">Hong-Hao Sun et al.</div>

<div class="links">
  <a href="#">Paper</a>
  <a href="#">Code</a>
</div>

<h2>Model Comparison</h2>

<!-- 只保留一个容器 -->
<div id="samples"></div>

</div>

<script>
// ===== 数据配置 =====
const samples = ["sample1","sample2","sample3"];
const snrs = ["-5","0","5","10","15","20"];

const models = [
  ["unprocessed","Unprocessed"],
  ["clean","Clean"],
  ["mvdr","Oracle MVDR"],
  ["fasnet","FasNet-TAC"],
  ["mimo","MIMO-UNet"],
  ["eabnet","EaBNet"],
  ["mcnet","McNet"],
  ["deftan","Deft-AN"],
  ["deftan2","DeFTAN-II"],
  ["ours","Ours (SAPE-MSE)"]
];

// ===== 生成函数 =====
const root = document.getElementById("samples");

samples.forEach((sample, sIdx) => {

  const section = document.createElement("div");
  section.className = "sample-section";

  section.innerHTML = `<div class="sample-title">Sample ${sIdx+1}</div>`;

  snrs.forEach(snr => {

    const row = document.createElement("div");
    row.className = "snr-row";

    row.innerHTML += `<div class="snr-title">SNR = ${snr} dB</div>`;

    const grid = document.createElement("div");
    grid.className = "model-grid";

    models.forEach(([key,name]) => {

      const card = document.createElement("div");
      card.className = "model-card";

      card.innerHTML = `
        <div>${name}</div>
        <img src="specs/${sample}/${snr}/${key}.png" class="spec-img"
             onerror="this.style.display='none'">
        <audio controls src="audio/${sample}/${snr}/${key}.wav"></audio>
      `;

      grid.appendChild(card);
    });

    row.appendChild(grid);
    section.appendChild(row);
  });

  root.appendChild(section);
});
</script>

</body>
</html>
